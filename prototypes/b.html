<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planning Poker – Prototype B (Roster list)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f4f5f7; color: #1f2933; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e3e6ea; }
  header h1 { font-size: 16px; margin: 0; }
  .link { font-size: 13px; color: #52606d; }
  .link code { background: #eef0f3; padding: 3px 8px; border-radius: 4px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px; }
  .hand { display: flex; gap: 12px; justify-content: center; margin-bottom: 8px; }
  .card { width: 82px; height: 116px; border: 2px solid #cbd2d9; border-radius: 10px; background: #fff; font-size: 30px; font-weight: 700; cursor: pointer; transition: transform .1s, border-color .1s; }
  .card:hover:not(:disabled) { transform: translateY(-4px); border-color: #4c6ef5; }
  .card.selected { transform: translateY(-10px); border-color: #4c6ef5; background: #edf2ff; color: #364fc7; }
  .card:disabled { cursor: default; opacity: .6; }
  .hint { text-align: center; font-size: 13px; color: #7b8794; min-height: 18px; margin-bottom: 20px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
  button.btn { padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; border: 1px solid #cbd2d9; background: #fff; cursor: pointer; }
  button.btn.primary { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
  .banner { border-radius: 12px; padding: 18px 24px; text-align: center; margin-bottom: 20px; }
  .banner.ok { background: #d3f9d8; color: #2b8a3e; }
  .banner.discuss { background: #fff3bf; color: #e67700; }
  .banner .big { font-size: 40px; font-weight: 800; }
  .banner .sub { font-size: 14px; margin-top: 4px; }
  .warn { text-align: center; font-size: 13px; color: #e67700; margin-bottom: 12px; }
  .roster { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #f0f2f4; }
  .row:last-child { border-bottom: 0; }
  .name { font-size: 15px; }
  .name .tag { font-size: 11px; color: #7b8794; margin-left: 8px; }
  .chip { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: #eef0f3; color: #7b8794; }
  .chip.voted { background: #d3f9d8; color: #2b8a3e; }
  .chip.obs { background: transparent; }
  .face { min-width: 44px; text-align: center; font-size: 20px; font-weight: 700; padding: 4px 12px; border: 2px solid #cbd2d9; border-radius: 8px; background: #fff; }
  .face.low, .face.high { border-color: #f08c00; background: #fff9db; }
  .face.novote { color: #adb5bd; font-weight: 400; font-size: 13px; }
  .proto { margin: 32px auto 0; max-width: 760px; padding: 14px 24px; border: 2px dashed #adb5bd; border-radius: 10px; background: #fff; font-size: 13px; }
  .proto strong { display: block; margin-bottom: 8px; color: #7b8794; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
  .proto button { margin: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Planning Poker</h1>
  <div class="link">Room link: <code>https://poker.example.com/r/k3x9fq</code></div>
</header>
<main id="app"></main>
<div class="proto">
  <strong>Prototype controls (not part of the real UI)</strong>
  <button data-act="rand">Teammates vote (random)</button>
  <button data-act="agree">Scenario: all agree (3, 5, 3, 3)</button>
  <button data-act="discuss">Scenario: discuss (3, 5, 3, 8)</button>
  <button data-act="missing">Scenario: two teammates haven't voted</button>
  <button data-act="wide">Scenario: 8 and 13 together</button>
  <button data-act="allcoffee">Scenario: everyone coffee</button>
</div>

<script>
const CARDS = ['1', '2', '3', '5', '8', '13', '☕'];
const SEQ = [1, 2, 3, 5, 8, 13];
const state = {
  revealed: false,
  players: [
    { name: 'You', me: true, vote: null },
    { name: 'Alice', vote: null },
    { name: 'Bob', vote: null },
    { name: 'Carlos', vote: null },
    { name: 'Dana', vote: null },
    { name: 'Evan', observer: true, vote: null },
  ],
};

function computeResult(players) {
  const nums = players.filter(p => !p.observer && p.vote && p.vote !== '☕').map(p => Number(p.vote));
  if (!nums.length) return { discuss: true, reason: 'No numeric votes' };
  const idx = nums.map(n => SEQ.indexOf(n));
  const lo = Math.min(...idx), hi = Math.max(...idx);
  if (hi - lo <= 1) return { points: SEQ[hi] };
  return { discuss: true, lo: SEQ[lo], hi: SEQ[hi], reason: `Spread is ${hi - lo} steps (${SEQ[lo]} to ${SEQ[hi]})` };
}

function voters() { return state.players.filter(p => !p.observer); }

function render() {
  const me = state.players[0];
  const missing = voters().filter(p => !p.vote);
  const res = computeResult(state.players);
  let banner = '';
  if (state.revealed) {
    banner = res.points
      ? `<div class="banner ok"><div class="big">${res.points} points</div></div>`
      : `<div class="banner discuss"><div class="big">Discuss</div><div class="sub">${res.reason}</div></div>`;
  }
  const warn = state.revealed && missing.length
    ? `<div class="warn">${missing.length} ${missing.length === 1 ? 'person hasn\'t' : 'people haven\'t'} voted</div>` : '';
  const rows = state.players.map(p => {
    let right;
    if (p.observer) right = '<span class="chip obs">observing</span>';
    else if (!state.revealed) right = p.vote ? '<span class="chip voted">voted ✓</span>' : '<span class="chip">waiting…</span>';
    else if (!p.vote) right = '<span class="face novote">no vote</span>';
    else {
      const out = res.discuss && res.lo && p.vote !== '☕' && (Number(p.vote) === res.lo || Number(p.vote) === res.hi);
      right = `<span class="face ${out ? (Number(p.vote) === res.lo ? 'low' : 'high') : ''}">${p.vote}</span>`;
    }
    return `<div class="row"><span class="name">${p.name}${p.me ? '<span class="tag">you</span>' : ''}</span>${right}</div>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <div class="hand">${CARDS.map(c => `<button class="card ${me.vote === c ? 'selected' : ''}" data-card="${c}" ${state.revealed ? 'disabled' : ''}>${c}</button>`).join('')}</div>
    <div class="hint">${state.revealed ? 'Cards are locked until the next round' : (me.vote ? 'You can change your vote until the reveal' : 'Pick a card')}</div>
    <div class="actions">
      <button class="btn primary" data-act="reveal" ${state.revealed ? 'disabled' : ''}>Reveal cards</button>
      <button class="btn" data-act="new">New round</button>
    </div>
    ${banner}${warn}
    <div class="roster">${rows}</div>`;
}

function setTeammates(votes, stagger) {
  const mates = state.players.filter(p => !p.me && !p.observer);
  mates.forEach((p, i) => {
    setTimeout(() => { if (!state.revealed) { p.vote = votes[i] ?? null; render(); } }, stagger ? i * 500 : 0);
  });
}
function newRound() { state.revealed = false; state.players.forEach(p => p.vote = null); render(); }

document.addEventListener('click', e => {
  const card = e.target.closest('[data-card]');
  if (card && !state.revealed) { state.players[0].vote = card.dataset.card; render(); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'reveal') { state.revealed = true; render(); }
  else if (act === 'new') newRound();
  else {
    if (state.revealed) newRound();
    if (act === 'rand') setTeammates([0, 1, 2, 3].map(() => CARDS[Math.floor(Math.random() * 6)]), true);
    if (act === 'agree') setTeammates(['3', '5', '3', '3'], true);
    if (act === 'discuss') setTeammates(['3', '5', '3', '8'], true);
    if (act === 'missing') setTeammates(['5', '5', null, null], true);
    if (act === 'wide') setTeammates(['8', '13', '8', '13'], true);
    if (act === 'allcoffee') { state.players[0].vote = '☕'; setTeammates(['☕', '☕', '☕', '☕'], true); render(); }
  }
});
render();
</script>
</body>
</html>
